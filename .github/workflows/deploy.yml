# Publishes the website to Cloudflare Pages (project "vine-india").
#
# Runs when:
#   - code is pushed to main
#   - every morning (06:00 India time), so the built-in copy of the church's content stays fresh
#   - someone clicks "Run workflow" on GitHub (Actions → Deploy website)
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
# The Supabase URL and publishable key below are public values (they ship to every visitor's browser).
name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: be13522c1fbee95ecec06c1f1a676a5f
    steps:
      # Until the secret is added this job skips quietly (no failure, no email);
      # the site is then published by hand with `npx wrangler pages deploy`.
      - name: Check the Cloudflare token is set
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipped: add the CLOUDFLARE_API_TOKEN secret (Settings → Secrets and variables → Actions) to publish automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://bkcaozczhiyxlkghtidl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Ml6UEqB-yxj9yiU5ZrYBSQ_3DT35sp1
          VITE_SITE_URL: https://thevineindia.org
          VITE_SITE_NAME: Vine India
          VITE_SITE_DESCRIPTION: A place to grow in faith, family and fellowship. Join us on Sunday, in a cell group, or online.

      - name: Publish to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        run: >
          npx --yes wrangler@4.166.0 pages deploy dist
          --project-name vine-india
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.event_name }} ${{ github.sha }}"
